name: Sync cardnews episodes

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cardnews-episodes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync episode data
        run: npm run sync-episodes

      - name: Commit updated episode inventory
        run: |
          if git diff --quiet -- lib/episodes.json; then
            echo "No episode changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/episodes.json
          git commit -m "chore: sync cardnews episodes"
          git push
